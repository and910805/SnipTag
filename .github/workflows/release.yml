name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      # runner 的 stdout 預設不是 UTF-8，測試印中文會 UnicodeEncodeError
      PYTHONIOENCODING: utf-8
      # 沒有實體桌面，用 Qt 的離螢幕平台
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安裝相依套件
        run: pip install -r requirements.txt pyinstaller

      - name: 執行測試
        run: |
          python test_naming.py
          python test_dpi.py
          python test_annotate.py
          python test_history.py
          python test_hotkeys.py
          python test_autostart.py
          python test_effects.py
          python test_welcome.py

      - name: 打包 exe
        run: python build.py

      - name: 產生 SHA256
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist/SnipTag.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  SnipTag.exe" | Out-File -FilePath dist/SnipTag.exe.sha256 `
            -Encoding utf8 -NoNewline
          "SHA256=$hash" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "SHA256: $hash"

      - name: 保留產物
        uses: actions/upload-artifact@v4
        with:
          name: SnipTag-exe
          path: dist/SnipTag.exe

      - name: 發佈 Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $repo = "${{ github.repository }}"
          $notes = @'
          ## 下載

          直接下載下面的 **SnipTag.exe**，雙擊就能用 —— 免安裝、不需要 Python、不需要系統管理員權限。

          啟動後常駐在系統匣（右下角），右鍵圖示可叫出所有功能。

          ## 先設定主題，再開始截圖

          | 熱鍵 | 功能 |
          | --- | --- |
          | `Ctrl+F1` | 設定這場會議 / 這個題目的主題 |
          | `Shift+F1` | 快速截圖：放開滑鼠**直接存檔**，檔名自動接續 |
          | `F1` | 框選截圖，出現工具列與標註功能 |
          | `F3` | 把剪貼簿裡的圖釘到桌面 |

          設好主題 `週會` 之後，每按一次 `Shift+F1` 框一下，就依序存成
          `週會_01.png`、`週會_02.png`、`週會_03.png`…… 不跳對話框、不用打字。

          完整說明請看 README：https://github.com/__REPO__#readme

          ## Code signing policy

          > **Application status: pending.** Current release binaries remain unsigned until
          > SignPath approves this project and the signing pipeline is enabled.

          After approval, Windows release binaries will use:

          > Free code signing provided by [SignPath.io](https://signpath.io/), certificate by
          > [SignPath Foundation](https://signpath.org/).

          - Committers and reviewers: [@and910805](https://github.com/and910805)
          - Approvers: [@and910805](https://github.com/and910805)

          Every external contribution is reviewed before merge, and every release signing
          request must be manually approved by the project maintainer.

          Privacy: This program will not transfer any information to other networked systems
          unless specifically requested by the user or the person installing or operating it.

          ## 檔案驗證

          這個 exe 沒有程式碼簽章，Windows SmartScreen 或防毒可能會跳「不明的發行者」。
          按「其他資訊」→「仍要執行」即可，或自行從原始碼建置（`python build.py`）。

          檔案是由 GitHub Actions 從本 repo 的原始碼建出來的，可以比對雜湊值：

          ```powershell
          Get-FileHash .\SnipTag.exe -Algorithm SHA256
          ```

          ```
          __SHA256__
          ```

          已啟用 Smart App Control 的電腦會直接擋掉未簽章的執行檔，那種情況請改用原始碼執行。

          ## 其他
          - 若已經有別的截圖工具綁在 `F1` / `F3`，熱鍵會被它搶走。SnipTag 啟動時
            會通知你哪個熱鍵註冊失敗，到「設定…」換一組即可。
          '@
          $notes = $notes.Replace("__REPO__", $repo).Replace("__SHA256__", $env:SHA256)
          $notes | Out-File -FilePath notes.md -Encoding utf8
          gh release create "$env:GITHUB_REF_NAME" `
            dist/SnipTag.exe dist/SnipTag.exe.sha256 `
            --title "SnipTag $env:GITHUB_REF_NAME" `
            --notes-file notes.md
